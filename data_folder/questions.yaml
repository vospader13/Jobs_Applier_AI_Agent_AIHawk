# --- Work Authorization ---
- question: "are you legally authorized to work in the united states"
  answer: "Yes"

- question: "do you require sponsorship to work in the united states"
  answer: "No"

- question: "will you now or in the future require sponsorship"
  answer: "No"

- question: "are you a us citizen or permanent resident"
  answer: "Yes"

- question: "are you eligible to work in the us without sponsorship"
  answer: "Yes"

- question: "what is your work authorization status"
  answer: "US Citizen"

